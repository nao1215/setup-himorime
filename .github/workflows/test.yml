name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks — these always run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        # -x lets ShellCheck follow the sourced install.sh from the tests.
        run: shellcheck -x scripts/install.sh scripts/version_test.sh scripts/install_test.sh

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Test version normalization
        run: bash scripts/version_test.sh

  # Checksum verification, extraction and installation against a fake release
  # archive, on every supported platform. Needs no published release.
  offline:
    name: Offline install steps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test install steps
        shell: bash
        run: bash scripts/install_test.sh

      - name: Test automatic comments
        run: node --test scripts/comment.test.mjs

  # Installs a real himorime release on every supported platform.
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup himorime
        id: setup
        uses: ./
        with:
          version: latest

      - name: Print resolved outputs
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          BIN_PATH: ${{ steps.setup.outputs.bin-path }}
          INSTALL_DIR: ${{ steps.setup.outputs.install-dir }}
        run: |
          echo "version=${VERSION}"
          echo "bin-path=${BIN_PATH}"
          echo "install-dir=${INSTALL_DIR}"

      - name: Verify himorime on PATH (bash)
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          command -v himorime
          himorime version | tee version.txt
          grep -F "${VERSION}" version.txt

      - name: Verify himorime on PATH (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command himorime
          himorime version

  # A pinned version must install exactly that release, whether the input has
  # the leading "v" or not, and a custom install-dir must be honoured.
  install-pinned:
    name: Install pinned ${{ matrix.version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [v0.6.0, 0.6.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup himorime
        id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
          install-dir: ${{ runner.temp }}/himorime-pinned

      - name: Verify the pinned release was installed
        shell: bash
        env:
          OUT_VERSION: ${{ steps.setup.outputs.version }}
          OUT_BIN_PATH: ${{ steps.setup.outputs.bin-path }}
          OUT_INSTALL_DIR: ${{ steps.setup.outputs.install-dir }}
          WANT_DIR: ${{ runner.temp }}/himorime-pinned
        run: |
          test "${OUT_VERSION}" = "v0.6.0" || { echo "version output: ${OUT_VERSION}" >&2; exit 1; }
          test "${OUT_INSTALL_DIR}" = "${WANT_DIR}" || { echo "install-dir output: ${OUT_INSTALL_DIR}" >&2; exit 1; }
          test -x "${OUT_BIN_PATH}" || { echo "bin-path is not executable: ${OUT_BIN_PATH}" >&2; exit 1; }
          got="$(himorime version)"
          echo "${got}"
          case "${got}" in
            "himorime v0.6.0 "*) ;;
            *) echo "unexpected version output" >&2; exit 1 ;;
          esac

  # A release that does not exist must fail the step instead of installing
  # something else or succeeding with nothing on PATH.
  install-missing:
    name: Install missing version (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup himorime with a version that was never released
        id: setup
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0

      - name: Expect the setup step to have failed
        shell: bash
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || { echo "setup outcome: ${OUTCOME}" >&2; exit 1; }
          if command -v himorime >/dev/null 2>&1; then
            echo "himorime is on PATH after a failed install: $(command -v himorime)" >&2
            exit 1
          fi
